<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7fc4">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ASSE Pointage">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ASSE POINTAGE — Enseignants et administration</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--tx:#17202b;--mut:#6b7684;--ac:#0b7fc4;--soft:#e3f1fb;--ok:#16976b;--bad:#d6455d;--warn:#d98a14;--bd:#e4e8ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151b;--card:#1a212a;--tx:#eef2f6;--mut:#92a0af;--ac:#4aa8e4;--soft:#173347;--ok:#42c79a;--bad:#ef7589;--warn:#eeb04b;--bd:#2b3541}}
:root[data-theme="dark"]{--bg:#10151b;--card:#1a212a;--tx:#eef2f6;--mut:#92a0af;--ac:#4aa8e4;--soft:#173347;--ok:#42c79a;--bad:#ef7589;--warn:#eeb04b;--bd:#2b3541}
html{color-scheme:light dark}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif;padding:16px;max-width:600px;margin-inline:auto}
h1{font-size:1.5rem;margin:6px 0 2px}h2{font-size:1rem;margin:0 0 10px}
.sub{color:var(--mut);font-size:.88rem;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.lb{display:flex;flex-direction:column;font-size:.78rem;color:var(--mut);gap:4px;flex:1 1 120px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px}
.stat small{color:var(--mut);font-size:.66rem;letter-spacing:.05em;text-transform:uppercase}
.stat b{display:block;font-size:1.5rem;margin-top:4px}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tab{flex:1;background:var(--card);color:var(--mut);border:1px solid var(--bd);padding:10px 4px;font-size:.88rem}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.add{display:flex;gap:8px;flex-wrap:wrap}
input,select{padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem;min-width:0}
input{flex:1 1 150px}
button{border:0;border-radius:10px;padding:12px 16px;font-size:.95rem;font-weight:600;cursor:pointer;color:#fff;background:var(--ac)}
button.out{background:var(--bad)}
button.ghost{background:transparent;color:var(--mut);padding:6px 10px;font-weight:400;font-size:.85rem}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.name{font-weight:600}.st{font-size:.82rem;color:var(--mut)}.on2{color:var(--ok)}
.badge{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--ac);margin-left:6px;font-weight:600}
.badge.adm{background:#efe6fb;color:#7a45c2}
@media (prefers-color-scheme:dark){.badge.adm{background:#2e2142;color:#b891ee}}
.log{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.9rem}
.log:last-child{border:0}.empty{color:var(--mut);font-size:.9rem}
.late{color:var(--warn)}
.hd{display:flex;align-items:center;gap:12px}.hd img{width:56px;height:56px;object-fit:contain;border-radius:10px;background:#fff;border:1px solid var(--bd);display:none}
#rpt{display:none}
@media print{html{color-scheme:light}body{background:#fff;color:#000;padding:0;max-width:none}body>*:not(#rpt){display:none!important}#rpt{display:block!important;color:#000}#rpt table{width:100%;border-collapse:collapse;font-size:12px}#rpt td,#rpt th{border:1px solid #999;padding:4px 6px;text-align:left}}
</style>
</head>
<body>
<div class="hd"><img id="logo" alt="Logo du collège"><h1 id="ttl">ASSE POINTAGE</h1></div>
<div class="sub">Temps &amp; présence · enseignants et administration<br><span id="date"></span><br><button class="ghost" id="cfgBtn" style="padding-left:0">⚙ Réglages du collège</button></div>

<div class="card" id="cfg" style="display:none"><h2>Informations du collège</h2>
<label class="lb">Nom du collège<input id="cn" maxlength="60" placeholder="Nom de ton collège"></label>
<label class="lb" style="margin-top:10px">Adresse<input id="ca" maxlength="80" placeholder="Ville, quartier…"></label>
<label class="lb" style="margin-top:10px">Téléphone<input id="ct" maxlength="30" placeholder="+225 …"></label>
<label class="lb" style="margin-top:10px">Directeur / directrice<input id="cd" maxlength="60"></label>
<label class="lb" style="margin-top:10px">Logo (image)<input type="file" id="lf" accept="image/*"></label>
<button class="ghost" id="lrm" style="padding-left:0">Retirer le logo</button></div>

<div class="stats">
  <div class="stat"><small>Présents</small><b id="s1">0</b></div>
  <div class="stat"><small>Sur place</small><b id="s4" style="color:var(--ok)">0</b></div>
  <div class="stat"><small>En retard</small><b id="s3" style="color:var(--warn)">0</b></div>
  <div class="stat"><small>Absents</small><b id="s2" style="color:var(--bad)">0</b></div>
  <div class="stat"><small>En congé</small><b id="s5" style="color:var(--ac)">0</b></div>
  <div class="stat"><small>À pointer</small><b id="s6">0</b></div>
</div>
<div class="sub" style="margin-top:-4px">Retard : arrivée après 08:00</div>

<div class="tabs">
  <button class="tab on" data-f="all">Tous</button>
  <button class="tab" data-f="ens">Enseignants</button>
  <button class="tab" data-f="adm">Administration</button>
</div>

<div class="card add">
  <input id="nom" placeholder="Nom et prénom" maxlength="40">
  <input id="fon" list="fns" placeholder="Fonction (ex. Prof de maths)" maxlength="50">
  <datalist id="fns"><option value="Professeur de Mathématiques"><option value="Professeur de Français"><option value="Professeur d’Anglais"><option value="Professeur d’Informatique"><option value="Directeur"><option value="Secrétaire"><option value="Surveillant général"><option value="Comptable"><option value="Éducateur"></datalist>
  <select id="grp"><option value="ens">Enseignant</option><option value="adm">Administration</option></select>
  <button id="addBtn">Ajouter</button>
</div>

<div class="card" id="rec"><h2>Enregistrer un pointage, une absence ou un congé</h2>
<div class="add"><select id="rp"></select><select id="rt"><option value="in">Arrivée</option><option value="out">Départ</option><option value="abs">Absence</option><option value="cge">Congé</option></select></div>
<div class="add" style="margin-top:8px"><label class="lb">Date<input type="date" id="rd1"></label><label class="lb" id="l2" style="display:none">Jusqu’au<input type="date" id="rd2"></label><label class="lb" id="l3">Heure<input type="time" id="rh"></label></div>
<div class="add" style="margin-top:8px"><input id="rm" list="mot" placeholder="Motif (maladie, formation…)" maxlength="60"><button id="recBtn">Enregistrer</button></div>
<datalist id="mot"><option value="Maladie"><option value="Raison familiale"><option value="Formation"><option value="Congé annuel"><option value="Congé maternité"><option value="Mission"><option value="Autre"></datalist></div>

<div id="people"></div>

<div class="card"><h2>Sur place maintenant</h2><div id="now"></div></div>
<div class="card"><h2>Journal du jour</h2><div id="log"></div></div>
<div class="card"><h2>Temps pointé aujourd’hui</h2><div id="tot"></div></div>
<div id="rpt"></div>

<div style="text-align:center"><button class="ghost" id="prt">Rapport PDF avec logo</button><button class="ghost" id="csv">Copier le tableau (Excel)</button><button class="ghost" id="reset">Effacer les données</button></div>

<script>
var LIM=8*60,F='all',S={people:[],logs:[]};
function load(){try{var r=localStorage.getItem('asse2')||localStorage.getItem('pointage');if(r){var d=JSON.parse(r);if(d&&d.people&&d.logs){d.people=d.people.map(function(p){return typeof p==='string'?{n:p,g:'ens'}:p});S=d}}}catch(e){}}
function save(){try{localStorage.setItem('asse2',JSON.stringify(S))}catch(e){}}
function day(t){return new Date(t).toDateString()}
function hm(t){return new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}
function dur(ms){var m=Math.max(0,Math.round(ms/60000));return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fnOf(n){var p=S.people.filter(function(x){return x.n===n})[0];return p&&p.f||''}
function gl(g){return g==='adm'?'Administration':'Enseignant'}
function lbl(t){return t==='in'?'Arrivée':t==='out'?'Départ':t==='cge'?'Congé':'Absence'}
function $(i){return document.getElementById(i)}
function iso(t){var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function away(n){var T=iso(Date.now()),r=null;S.logs.forEach(function(l){if(l.n===n&&(l.t==='abs'||l.t==='cge')){var du=l.du||iso(l.at),au=l.au||du;if(du<=T&&T<=au)r=l}});return r}
function toggle(){var t=$('rt').value,x=(t==='abs'||t==='cge');$('l2').style.display=x?'flex':'none';$('l3').style.display=x?'none':'flex'}
function prefill(n,t){$('rp').value=n;$('rt').value=t;toggle();$('rec').scrollIntoView({behavior:'smooth'})}
function initRec(){$('rd1').value=iso(Date.now());var d=new Date();$('rh').value=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function tl(n){var T=day(Date.now());return S.logs.filter(function(l){return l.n===n&&day(l.at)===T})}
function isIn(n){for(var i=S.logs.length-1;i>=0;i--){var l=S.logs[i];if(l.n===n&&(l.t==='in'||l.t==='out'))return l.t==='in'}return false}
function firstIn(n){var a=tl(n).filter(function(l){return l.t==='in'});return a.length?a[0].at:null}
function punch(n){S.logs.push({n:n,t:isIn(n)?'out':'in',at:Date.now()});save();render()}
function inFilter(p){return F==='all'||p.g===F}
function render(){
  document.getElementById('date').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  var ps=S.people.filter(inFilter),pr=0,ab=0,lt=0,sp=0,cg=0,tp=0,now='';
  ps.forEach(function(p){var f=firstIn(p.n),on=isIn(p.n),aw=away(p.n);
    if(f){pr++;var d=new Date(f);if(d.getHours()*60+d.getMinutes()>LIM)lt++}
    else if(aw){if(aw.t==='cge')cg++;else ab++}
    else tp++;
    if(on){sp++;var last=null;tl(p.n).forEach(function(l){if(l.t==='in')last=l.at});
      now+='<div class="log"><span>'+esc(p.n)+'<span class="badge '+p.g+'">'+gl(p.g)+'</span></span><span class="on2">depuis '+hm(last||Date.now())+'</span></div>'}});
  document.getElementById('s1').textContent=pr;document.getElementById('s2').textContent=ab;
  document.getElementById('s3').textContent=lt;document.getElementById('s4').textContent=sp;$('s5').textContent=cg;$('s6').textContent=tp;
  document.getElementById('now').innerHTML=now||'<div class="empty">Personne pour le moment.</div>';
  var el=document.getElementById('people');
  el.innerHTML=ps.length?'':'<div class="card empty">Ajoute une personne pour commencer.</div>';
  ps.forEach(function(p){var on=isIn(p.n),aw=away(p.n),d=document.createElement('div');
    d.className='card row';
    d.innerHTML='<div><div class="name">'+esc(p.n)+'<span class="badge '+p.g+'">'+gl(p.g)+'</span></div><div class="fn st" style="cursor:pointer">'+(p.f?esc(p.f):'+ ajouter la fonction')+'</div><div class="st '+(on?'on2':'')+'">'+(on?'Présent(e)':(aw?lbl(aw.t)+(aw.motif?' · '+esc(aw.motif):'')+(aw.au&&aw.au!==aw.du?' (jusqu’au '+aw.au.split('-').reverse().join('/')+')':''):'Pas encore pointé(e)'))+'</div></div>'+
    '<div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><button class="'+(on?'out':'')+'">'+(on?'Départ':'Arrivée')+'</button>'+(on?'':'<button class="ghost ab">Absence / congé</button>')+'</div>';
    d.querySelector('button').onclick=function(){punch(p.n)};
    d.querySelector('.fn').onclick=function(){var i=document.createElement('input');i.value=p.f||'';i.placeholder='Fonction';i.setAttribute('list','fns');i.style.padding='6px 8px';i.style.fontSize='.85rem';this.replaceWith(i);i.focus();i.onblur=function(){p.f=i.value.trim();save();render()};i.onkeydown=function(e){if(e.key==='Enter')i.blur()}};
    var b=d.querySelector('.ab');if(b)b.onclick=function(){prefill(p.n,'abs')};
    el.appendChild(d)});
  var names=ps.map(function(p){return p.n}),T=day(Date.now());
  var tdl=S.logs.filter(function(l){return day(l.at)===T&&names.indexOf(l.n)>=0});
  document.getElementById('log').innerHTML=tdl.length?tdl.slice().reverse().map(function(l){return '<div class="log"><span>'+esc(l.n)+'</span><span>'+lbl(l.t)+(l.motif?' · '+esc(l.motif):'')+' · '+hm(l.at)+'</span></div>'}).join(''):'<div class="empty">Aucun pointage aujourd’hui.</div>';
  var h='';ps.forEach(function(p){var sum=0,st=null;
    tl(p.n).forEach(function(l){if(l.t==='in')st=l.at;else if(l.t==='out'&&st){sum+=l.at-st;st=null}});
    if(st)sum+=Date.now()-st;
    if(sum>0)h+='<div class="log"><span>'+esc(p.n)+'</span><span>'+dur(sum)+'</span></div>'});
  document.getElementById('tot').innerHTML=h||'<div class="empty">Pas encore de durée.</div>';
  var rp=$('rp'),k=S.people.map(function(p){return p.n}).join('|');
  if(rp.dataset.k!==k){var cur=rp.value;rp.innerHTML=S.people.map(function(p){return '<option>'+esc(p.n)+'</option>'}).join('');rp.dataset.k=k;if(cur)rp.value=cur}
}
document.querySelectorAll('.tab').forEach(function(b){b.onclick=function(){F=b.dataset.f;document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x===b)});render()}});
document.getElementById('addBtn').onclick=function(){var i=document.getElementById('nom'),v=i.value.trim();
  if(v&&!S.people.some(function(p){return p.n===v})){S.people.push({n:v,g:document.getElementById('grp').value,f:$('fon').value.trim()});$('fon').value='';save();render()}i.value=''};
document.getElementById('nom').onkeydown=function(e){if(e.key==='Enter')document.getElementById('addBtn').click()};
document.getElementById('csv').onclick=function(){var g={};S.people.forEach(function(p){g[p.n]=p.g});
  var t=(C.name?C.name+(C.addr?' - '+C.addr:'')+'\n':'')+'Nom\tGroupe\tFonction\tType\tDate\tHeure\tMotif\tDu\tAu\n'+S.logs.map(function(l){return [l.n,gl(g[l.n]),fnOf(l.n),lbl(l.t),new Date(l.at).toLocaleDateString('fr-FR'),hm(l.at),l.motif||'',l.du||'',l.au||''].join('\t')}).join('\n');
  var b=this;try{navigator.clipboard.writeText(t).then(function(){b.textContent='Copié ! Colle dans Excel'})}catch(e){b.textContent='Copie impossible'}};
document.getElementById('reset').onclick=function(){if(confirm('Effacer toutes les données ?')){S={people:[],logs:[]};save();render()}};
$('rt').onchange=toggle;
$('recBtn').onclick=function(){var n=$('rp').value,t=$('rt').value,d1=$('rd1').value||iso(Date.now()),rec={n:n,t:t,at:Date.now()};
  if(!n)return;
  if(t==='in'||t==='out'){rec.at=new Date(d1+'T'+($('rh').value||'00:00')+':00').getTime()}
  else{rec.du=d1;rec.au=$('rd2').value||d1;if(rec.au<rec.du)rec.au=rec.du}
  var m=$('rm').value.trim();if(m)rec.motif=m;
  S.logs.push(rec);S.logs.sort(function(a,b){return a.at-b.at});save();$('rm').value='';render()};
var C={name:'',logo:'',addr:'',tel:'',dir:''};
function saveC(){try{localStorage.setItem('asse_cfg',JSON.stringify(C))}catch(e){}}
function paintC(){var n=C.name||'ASSE POINTAGE';$('ttl').textContent=n;document.title=n+' — Pointage';var im=$('logo');if(C.logo){im.src=C.logo;im.style.display='block'}else{im.removeAttribute('src');im.style.display='none'}}
try{var rc=localStorage.getItem('asse_cfg');if(rc){var dc=JSON.parse(rc);if(dc)C={name:dc.name||'',logo:dc.logo||'',addr:dc.addr||'',tel:dc.tel||'',dir:dc.dir||''}}}catch(e){}
$('cn').value=C.name;$('ca').value=C.addr;$('ct').value=C.tel;$('cd').value=C.dir;paintC();
$('cfgBtn').onclick=function(){var c=$('cfg');c.style.display=c.style.display==='none'?'block':'none'};
$('cn').oninput=function(){C.name=this.value.trim();saveC();paintC()};
$('ca').oninput=function(){C.addr=this.value.trim();saveC()};
$('ct').oninput=function(){C.tel=this.value.trim();saveC()};
$('cd').oninput=function(){C.dir=this.value.trim();saveC()};
$('prt').onclick=function(){var g={};S.people.forEach(function(p){g[p.n]=p.g});
  var fr=function(d){return d.split('-').reverse().join('/')};
  var rows=S.logs.map(function(l){var x=(l.t==='in'||l.t==='out')?hm(l.at):(l.du?fr(l.du)+(l.au&&l.au!==l.du?' → '+fr(l.au):''):'');return '<tr><td>'+esc(l.n)+'</td><td>'+gl(g[l.n])+'</td><td>'+esc(fnOf(l.n))+'</td><td>'+lbl(l.t)+'</td><td>'+new Date(l.at).toLocaleDateString('fr-FR')+'</td><td>'+x+'</td><td>'+esc(l.motif||'')+'</td></tr>'}).join('');
  var info=[C.addr,C.tel&&('Tél : '+C.tel),C.dir&&('Direction : '+C.dir)].filter(Boolean).map(esc).join(' · ');
  $('rpt').innerHTML='<div style="display:flex;align-items:center;gap:14px;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:12px">'+(C.logo?'<img src="'+C.logo+'" style="width:80px;height:80px;object-fit:contain">':'')+'<div><div style="font-size:20px;font-weight:700">'+esc(C.name||'ASSE POINTAGE')+'</div><div style="font-size:12px">'+info+'</div></div></div><h2 style="font-size:16px">Rapport de pointage — '+new Date().toLocaleDateString('fr-FR')+'</h2><table><thead><tr><th>Nom</th><th>Groupe</th><th>Fonction</th><th>Type</th><th>Date</th><th>Heure / période</th><th>Motif</th></tr></thead><tbody>'+rows+'</tbody></table>';
  try{window.print()}catch(e){alert('Impression impossible ici. Ouvre le fichier téléchargé dans ton navigateur.')}};
$('lrm').onclick=function(){C.logo='';$('lf').value='';saveC();paintC()};
$('lf').onchange=function(){var f=this.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,256/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));c.getContext('2d').drawImage(im,0,0,c.width,c.height);C.logo=c.toDataURL('image/png');saveC();paintC()};im.src=rd.result};rd.readAsDataURL(f)};
load();initRec();render();setInterval(function(){var a=document.activeElement;if(!a||a.tagName!=='INPUT')render()},60000);
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
</body>
</html>
